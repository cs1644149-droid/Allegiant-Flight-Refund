{% extends "base.html" %}
{% block title %}Administrator Login{% endblock %}
{% block content %}
<section class="login-card"><h1>Administrator sign in</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button" type="submit">Sign in</button></form></section>
{% endblock %}
